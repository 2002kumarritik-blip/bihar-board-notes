<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>बिहार बोर्ड कक्षा 10 स्टडी ऐप</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f4f8;color:#222}
header{background:#075e54;color:white;text-align:center;padding:22px 12px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:white;padding:12px;position:sticky;top:0;z-index:10}
button{border:0;border-radius:8px;padding:12px 15px;background:#087f5b;color:white;font-size:16px;cursor:pointer}
nav button,.subject{background:#e4f5ef;color:#075e54}
main{max-width:850px;margin:20px auto;padding:0 12px}
.card{background:white;padding:20px;margin-bottom:16px;border-radius:14px;box-shadow:0 2px 8px #0001}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subject{padding:20px;font-size:18px;font-weight:bold}
.pdf-list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:15px}
.pdf-link{display:block;text-decoration:none;background:#e4f5ef;color:#075e54;padding:14px;border-radius:8px;font-weight:bold;border:1px solid #b7e4d7}
.pdf-link:hover{background:#d1fae5}
.question{padding:15px 0;border-bottom:1px solid #ddd}
.option{display:block;background:#f1f5f9;color:#222;text-align:left;width:100%;margin:8px 0}
.correct{background:#d1fae5!important}
.wrong{background:#fee2e2!important}
.hidden{display:none}
small{color:#555}
@media(max-width:420px){
.subjects{grid-template-columns:1fr}
header h1{font-size:25px}
.card{padding:15px}
}
</style></head><body>
<header>
<h1>📚 बिहार बोर्ड क्लास 10</h1>
<p>नोट्स • महत्वपूर्ण प्रश्न • MCQ टेस्ट • मॉडल पेपर</p>
</header><nav>
<button onclick="home()">होम</button>
<button onclick="showSubjects()">विषय</button>
<button onclick="loadMCQ()">MCQ टेस्ट</button>
<button onclick="showPapers()">मॉडल पेपर</button>
</nav><main>
<section id="home" class="card">
<h2>स्वागत है! 🎓</h2>
<p>कक्षा 10 की परीक्षा की तैयारी यहाँ से शुरू करें।</p><div class="subjects">
<button class="subject" onclick="showSubject('हिंदी')">📖 हिंदी</button>
<button class="subject" onclick="showSubject('अंग्रेज़ी')">🔤 अंग्रेज़ी</button>
<button class="subject" onclick="showSubject('गणित')">➗ गणित</button>
<button class="subject" onclick="showSubject('विज्ञान')">🧪 विज्ञान</button>
<button class="subject" onclick="showSubject('सामाजिक विज्ञान')">🌍 सामाजिक विज्ञान</button>
</div><div style="margin-top:18px">
<a class="pdf-link" href="./MCQS.pdf" target="_blank" rel="noopener">📝 महत्वपूर्ण MCQs की PDF खोलें</a>
</div><p>नोट्स पढ़ने के लिए विषय चुनें और MCQ टेस्ट देने के लिए टेस्ट बटन दबाएँ।</p>
<button onclick="loadMCQ()">MCQ टेस्ट शुरू करें</button>
</section><section id="content" class="card hidden">
<h2 id="heading"></h2>
<div id="details"></div>
<button onclick="home()" style="margin-top:18px">होम पर वापस जाएँ</button>
</section><section id="test" class="card hidden">
<h2>📝 MCQ टेस्ट</h2>
<p id="status">प्रश्न लोड हो रहे हैं...</p>
<div id="questions"></div>
<button id="scoreButton" onclick="showScore()" class="hidden">स्कोर देखें</button>
<div id="result"></div>
</section>
</main><script>
let allQuestions=[];
let selectedQuestions=[];
let score=0;
let answered=0;

const sciencePDFs=[
{title:"अध्याय 1 — रासायनिक अभिक्रियाएँ एवं समीकरण",file:"chapter%201.pdf"},
{title:"अध्याय 2 — अम्ल, क्षारक एवं लवण",file:"chapter%202.pdf"},
{title:"अध्याय 3 — धातु एवं अधातु",file:"chapter%203.pdf"},
{title:"अध्याय 4 — कार्बन एवं उसके यौगिक",file:"chapter%204.pdf"},
{title:"अध्याय 5 — तत्वों का आवर्त वर्गीकरण",file:"chapter%205.pdf"},
{title:"अध्याय 6 — जैव प्रक्रम",file:"chapter%206.pdf"},
{title:"अध्याय 7 — नियंत्रण एवं समन्वय",file:"chapter%207.pdf"},
{title:"अध्याय 8 — जीव जनन कैसे करते हैं",file:"chapter%208.pdf"},
{title:"अध्याय 9 — आनुवंशिकता एवं जैव विकास",file:"chapter%209.pdf"},
{title:"अध्याय 10 — प्रकाश: परावर्तन तथा अपवर्तन",file:"chapter%2010.pdf"},
{title:"अध्याय 11 — मानव नेत्र तथा रंगबिरंगा संसार",file:"chapter%2011.pdf"},
{title:"अध्याय 12 — विद्युत",file:"chapter%2012.pdf"},
{title:"अध्याय 13 — विद्युत धारा के चुंबकीय प्रभाव",file:"chapter%2013.pdf"},
{title:"अध्याय 14 — ऊर्जा के स्रोत",file:"chapter%2014.pdf"},
{title:"अध्याय 15 — हमारा पर्यावरण",file:"chapter%2015.pdf"},
{title:"अध्याय 16 — प्राकृतिक संसाधनों का प्रबंधन",file:"chapter%2016.pdf"}
];

function hideAll(){
 document.getElementById('home').classList.add('hidden');
 document.getElementById('content').classList.add('hidden');
 document.getElementById('test').classList.add('hidden');
}

function home(){
 hideAll();
 document.getElementById('home').classList.remove('hidden');
 window.scrollTo(0,0);
}

function showSubjects(){
 hideAll();
 document.getElementById('content').classList.remove('hidden');
 document.getElementById('heading').textContent='सभी विषय';
 document.getElementById('details').innerHTML=
 '<p>अपनी पसंद का विषय चुनने के लिए होम पेज पर वापस जाएँ।</p>';
}

function showSubject(subject){
 hideAll();
 document.getElementById('content').classList.remove('hidden');
 document.getElementById('heading').textContent=subject;

 const details=document.getElementById('details');

 if(subject==='विज्ञान'){
  details.innerHTML='<p>📚 कक्षा 10 विज्ञान के अध्याय के नोट्स पढ़ने के लिए नीचे दिए गए बटन दबाएँ।</p>';

  const list=document.createElement('div');
  list.className='pdf-list';

  sciencePDFs.forEach(chapter=>{
   const a=document.createElement('a');
   a.className='pdf-link';
   a.href='./'+chapter.file;
   a.target='_blank';
   a.rel='noopener';
   a.textContent='📄 '+chapter.title+' — PDF खोलें';
   list.appendChild(a);
  });

  details.appendChild(list);

  const mcq=document.createElement('a');
  mcq.className='pdf-link';
  mcq.href='./MCQS.pdf';
  mcq.target='_blank';
  mcq.rel='noopener';
  mcq.textContent='📝 महत्वपूर्ण MCQs की PDF खोलें';
  mcq.style.marginTop='14px';
  mcq.style.display='block';
  details.appendChild(mcq);

  const testButton=document.createElement('button');
  testButton.textContent='विज्ञान का ऑनलाइन MCQ टेस्ट';
  testButton.style.marginTop='14px';
  testButton.onclick=()=>loadMCQ('विज्ञान');
  details.appendChild(testButton);

 }else{
  details.innerHTML=
  '<p>'+subject+' के नोट्स की PDF अभी इस ऐप में नहीं जोड़ी गई है।</p>';
 }
}

function showPapers(){
 hideAll();
 document.getElementById('content').classList.remove('hidden');
 document.getElementById('heading').textContent='मॉडल पेपर';
 document.getElementById('details').innerHTML=
 '<p>मॉडल पेपर की PDF उपलब्ध होने पर उसके लिंक यहाँ जोड़े जा सकते हैं।</p>';
}

async function loadMCQ(subject=''){
 hideAll();
 document.getElementById('test').classList.remove('hidden');
 document.getElementById('status').textContent='प्रश्न लोड हो रहे हैं...';
 document.getElementById('questions').innerHTML='';
 document.getElementById('result').innerHTML='';
 document.getElementById('scoreButton').classList.add('hidden');
 score=0;
 answered=0;

 try{
  const response=await fetch('./questions.json');
  if(!response.ok) throw new Error('questions.json नहीं खुली');

  const data=await response.json();
  let science=(data.science||[]).map(q=>({...q,subject:'विज्ञान'}));
  let social=(data.socialScience||[]).map(q=>({...q,subject:'सामाजिक विज्ञान'}));

  allQuestions=[...science,...social];

  selectedQuestions=subject
   ?allQuestions.filter(q=>q.subject===subject)
   :allQuestions;

  if(!selectedQuestions.length){
   document.getElementById('status').textContent='अभी प्रश्न नहीं मिले। questions.json में प्रश्न जोड़ें।';
   return;
  }

  document.getElementById('status').textContent='कुल प्रश्न: '+selectedQuestions.length;
  renderQuestions();

 }catch(error){
  document.getElementById('status').textContent=
  'प्रश्न लोड नहीं हुए। जाँचें कि questions.json उसी फ़ोल्डर में है और JSON सही है।';
 }
}

function renderQuestions(){
 const box=document.getElementById('questions');

 selectedQuestions.forEach((q,i)=>{
  const item=document.createElement('div');
  item.className='question';

  const title=document.createElement('h3');
  title.textContent=(i+1)+'. '+q.question;
  item.appendChild(title);

  (q.options||[]).forEach((option,j)=>{
   const b=document.createElement('button');
   b.className='option';
   b.textContent=String.fromCharCode(65+j)+'. '+option;

   b.onclick=()=>{
    if(item.dataset.answered) return;

    item.dataset.answered='yes';
    answered++;

    const correct=Number(q.answer);

    if(j===correct){
     score++;
     b.classList.add('correct');
     b.textContent+=' — सही उत्तर!';
    }else{
     b.classList.add('wrong');
     b.textContent+=' — गलत उत्तर';

     const buttons=item.querySelectorAll('.option');
     if(buttons[correct]){
      buttons[correct].classList.add('correct');
      buttons[correct].textContent+=' — सही उत्तर!';
     }
    }

    item.querySelectorAll('button').forEach(x=>x.disabled=true);

    if(answered===selectedQuestions.length){
     document.getElementById('scoreButton').classList.remove('hidden');
    }
   };

   item.appendChild(b);
  });

  box.appendChild(item);
 });
}

function showScore(){
 document.getElementById('result').innerHTML=
 '<h2>आपका स्कोर: '+score+' / '+selectedQuestions.length+'</h2>'+
 '<p>आपने '+answered+' प्रश्नों के उत्तर दिए।</p>'+
 '<button onclick="loadMCQ()">फिर से टेस्ट दें</button>';
}
</script></body>
</html>
